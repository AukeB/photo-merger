[project]
name = "photo-merger"
version = "0.1.0"
description = "Merge photos from multiple directories chronologically into a single directory by extracting metdata"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "logging>=0.4.9.6",
    "pillow>=12.0.0",
    "pillow-heif>=1.1.1",
    "pydantic>=2.12.3",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "docstring-tailor>=0.4.1",
    "mypy>=1.18.2",
    "pyright>=1.1.414",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.11.6",
    "ty>=0.0.29",
]

[tool.docstring_tailor]
line-length = 88
style = "google"
detect-lists = true


[[tool.mypy.overrides]]
module = ["yaml.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
